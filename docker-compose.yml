version: '3.8'

services:
  postgres:
    container_name: cti_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cti_admin
      POSTGRES_PASSWORD: cti_secret_password
      POSTGRES_DB: threat_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti_admin -d threat_intel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: cti_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: cti_api
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Override the default URL to use Docker's internal DNS instead of localhost
    environment:
      - DATABASE_URL=postgresql+asyncpg://cti_admin:cti_secret_password@postgres:5432/threat_intel
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["./entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  postgres_data:
  redis_data: