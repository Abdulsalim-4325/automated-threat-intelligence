steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create Test Environment Variables
      run: |
        cat << EOF > .env
        POSTGRES_USER=cti_admin
        POSTGRES_PASSWORD=ci_test_password
        POSTGRES_DB=threat_intel
        DATABASE_URL=postgresql+asyncpg://cti_admin:ci_test_password@postgres:5432/threat_intel
        REDIS_URL=redis://redis:6379/0
        EOF

    - name: Build and Start Docker Compose Stack
      run: |
        docker compose up --build -d
        
    - name: Wait for Application Boot
      run: |
        echo "Waiting for PostgreSQL, Redis, and FastAPI to initialize..."
        sleep 15
        docker compose ps
        docker compose logs api

    - name: Run E2E Integration Tests
      run: |
        docker compose exec -T api pytest tests/test_e2e.py -v